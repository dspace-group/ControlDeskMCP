name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --locked --python ${{ env.PYTHON_VERSION }} --extra dev

      - name: Ruff lint
        run: uv run ruff check controldesk_mcp tests

      - name: Ruff format check
        run: uv run ruff format --check controldesk_mcp tests

      - name: Validate MCP tool decorators
        run: uv run python scripts/validate_mcp_tools.py

      - name: Layer boundary check
        shell: pwsh
        run: ./scripts/check_layer_boundaries.ps1

  tests:
    name: Tests (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python-version }} --extra dev

      - name: Run unit tests
        run: uv run pytest tests/unit/ -m "not integration" -v

  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    needs:
      - lint
      - tests
    steps:
      - name: Gate passed
        run: echo "All CI checks passed."

  # Future jobs can be added below and linked with `needs: [quality-gate]`.
  # Example categories: package build, release publishing, docs checks, security scans.
