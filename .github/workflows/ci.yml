name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --python ${{ env.PYTHON_VERSION }} --extra dev

      - name: Ruff lint
        run: uv run ruff check sources tests

      - name: Black format check
        run: uv run black --check sources tests

      - name: Validate MCP tool decorators
        run: uv run python scripts/validate_mcp_tools.py

      - name: Layer boundary check
        shell: pwsh
        run: ./scripts/check_layer_boundaries.ps1

  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --python ${{ env.PYTHON_VERSION }} --extra dev

      - name: Run unit tests
        run: uv run pytest tests/unit/ -m "not integration and not product and not llm_product" -v

  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    needs:
      - lint
      - tests
    steps:
      - name: Gate passed
        run: echo "All CI checks passed."

  # Future jobs can be added below and linked with `needs: [quality-gate]`.
  # Example categories: package build, release publishing, docs checks, security scans.
